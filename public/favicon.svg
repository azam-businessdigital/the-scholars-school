  <!-- Open Book of Knowledge at Bottom -->
  <path d="M26,98 C42,92 58,95 64,103 C70,95 86,92 102,98 L102,91 C86,85 70,88 64,95 C58,88 42,85 26,91 Z" fill="url(#goldGrad)"/>
